name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -mod=vendor
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install golangci-lint
        # Job GOFLAGS is -mod=vendor; this CLI is not in vendor/.
        env:
          GOFLAGS: -mod=mod
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      # main.go embeds frontend/dist (gitignored); Go packages need it before test/lint.
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: go test
        run: go test ./...

      - name: golangci-lint
        run: golangci-lint run ./...
