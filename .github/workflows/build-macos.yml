name: build-macos

# Packages RouteDeck.app for smoke and internal distribution.
# Ad-hoc codesign only (Taskfile). No Developer ID and no notarization.
# Tag v1.2.3 → app version 1.2.3 (+ sidebar/Settings "v1.2.3"); otherwise "dev".
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        # Isolate from repo GOFLAGS; CLI is not built via this module's vendor/.
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Resolve version metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Package RouteDeck.app
        env:
          GOFLAGS: -mod=vendor
        run: >
          wails3 task darwin:package
          APP_VERSION=${{ steps.meta.outputs.version }}
          APP_COMMIT=${{ steps.meta.outputs.commit }}

      - name: Zip app bundle
        run: |
          test -d bin/RouteDeck.app
          ditto -c -k --keepParent bin/RouteDeck.app bin/RouteDeck.app.zip

      - name: Upload RouteDeck.app.zip
        uses: actions/upload-artifact@v4
        with:
          name: RouteDeck-macos-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.commit }}
          path: bin/RouteDeck.app.zip
          if-no-files-found: error
