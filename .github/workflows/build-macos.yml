name: build-macos

# Packages RouteDeck.dmg for smoke, internal distribution, and tag Releases.
# Ad-hoc codesign only (Taskfile). No Developer ID and no notarization.
# Tag v1.2.3 → app version 1.2.3 (+ sidebar/Settings "v1.2.3"); otherwise "dev".
# On v* tags: published GitHub Release with RouteDeck.dmg only (no zip).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        # vendor/ defaults to -mod=vendor; this CLI is not in vendor/.
        env:
          GOFLAGS: -mod=mod
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Resolve version metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Package RouteDeck.dmg
        env:
          GOFLAGS: -mod=vendor
        run: >
          wails3 task darwin:package:dmg
          APP_VERSION=${{ steps.meta.outputs.version }}
          APP_COMMIT=${{ steps.meta.outputs.commit }}

      - name: Verify DMG
        run: test -f bin/RouteDeck.dmg

      - name: Upload RouteDeck.dmg
        uses: actions/upload-artifact@v4
        with:
          name: RouteDeck-macos-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.commit }}
          path: bin/RouteDeck.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/RouteDeck.dmg
          draft: false
          generate_release_notes: true
          body: |
            macOS DMG (ad-hoc codesign only — not notarized).
            Gatekeeper may block first open: Right-click → Open.
            RouteDeck does not embed ProxyBridge; install and approve the system extension separately.
            See `docs/operations/release.md`.
